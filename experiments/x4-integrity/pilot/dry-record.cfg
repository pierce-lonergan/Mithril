# X4 noise pilot -- DRY-RUN acceptance configuration at the RECORD's sensor windows (revision 5, review
# round 5, 2026-10-23). NOT a pilot configuration. It adds to dry.cfg's night (which runs at 100-ms
# windows on sub-second runs) what that night never exercises:
#   - the record's sensor windows and start state: 2-s load, 1-s disk sample, 60-s settle, disk queue 0
#     and writes <= 1 MiB/s (the values pilotcfg::pilot_rules holds for PILOT);
#   - a bracket-ELIGIBLE run: the microbenchmark stand-in runs dry_mb_tiny for 220,000 calls (about
#     1.25 s at 5.69 us per call [M, 2026-10-23]), over the 1-s bracket floor, so its runs take the
#     Accept path with the bracket judged, not the dry-only bracket_too_short exemption;
#   - the TimeCapped path: the end-to-end stand-in runs 600,000 calls (about 3.4 s) under a 2-s time
#     cap, so every one of its runs is capped (a slow outlier), with the e2e cool-down between runs.
# Small on purpose (one 6-block and one 3-block session): run it with --max-sessions 2, no plants (the
# estimator's --dry-test reads such a night; plant sessions have no progress lines). Both goldens are the
# microbenchmark's output, which does not depend on K (55b9c367...a036 on every dev build [M]); a capped
# run is never compared with it.
#
#   cmd /c start "" /b /wait /affinity 0x1C000000 D:\mithril\x4rev4r\bin\x4svc.exe pilot-night --config <this file> --dry-run --max-sessions 2
#
# Relaxed ON PURPOSE (a daytime machine with GEMS and other agents would discard or void every block,
# as in dry.cfg): the 40% load gate is the record's; the run core rule (LP 28's sibling, LP 29, is outside
# this track's LPs), background CPU, GPU and the image lists are relaxed. The driver's own D: writes
# (its record lines, the scratch wipe after each run) fall inside the 1-s disk-write sample of the next
# gate (record section 10).
