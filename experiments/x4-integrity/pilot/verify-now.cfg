# X4 noise pilot -- the PILOT template with its unpinned values left open, for the read-only
# pre-start report of 2026-10-23 (x4svc verify-hygiene --config verify-now.cfg --as-pilot). grade DEV:
# no night can run under it. Revision 4: the record's lists, the CUDA variable, o_rt = 5 s, derive. Unpinned: freeze commit, seed rule, harness pins, goldens, pins files,
# the Qwen3 server and GEMS image names. Generated from pilot.cfg.template by the X4 pilot track.
#
#   x4svc pilot-plan     --config <filled copy>            # the session order, read-only
#   x4svc verify-hygiene --config <filled copy>            # every pre-start item, read-only
#   x4svc pilot-night    --config <filled copy> --pilot    # a pilot night (Pierce, or the approved job wrapper)
#
# Values marked [pre-night amendment] are mechanical (record section "Amendments"): they are filled
# from the commands named beside them, by the lead engineer, and recorded in the amendment before the
# first night. Values marked [C01]/[C02]/[signing] come from the Owner's answers or the OWNER-QUEUE
# default the record registers (record section 3a).
grade = DEV
record = docs/m0/prereg/X4-noise-pilot.md
# freeze_commit: none yet (the record is DRAFT)
# signed_tag: none yet
# [pre-night amendment] `x4svc pilot-plan` prints the rule's value for the freeze commit; the driver
# refuses any other seed
seed = 6a314c1f9fc1d48b
data_dir = D:\mithril-data\x4\pilot
scratch = D:\mithril-data\x4\scratch
probe_exe = D:\mithril\x4c\bin\x4sb_probe.exe
# record section 10: agent and build images, the local Qwen3 server, WSL, the launchers observed on the
# desktop [M, 2026-10-16]; the GEMS images Pierce lists at signing [signing]
excluded_images = claude, node, cl, link, cargo, rustc, python, pythonw, mithi, mithc, vmmemWSL, vmmem, wsl, wslhost, OneDrive, Overwolf, CurseForge, EpicGamesLauncher
excluded_started_images = sshd, sshd-session, powershell, pwsh, cmd
# Defender, the indexer and Windows Update servicing (block discard above 1% of one core over a block)
bg_images = MsMpEng, MpDefenderCoreService, MpCmdRun, SearchIndexer, SearchProtocolHost, SearchFilterHost, TiWorker, TrustedInstaller, MoUsoCoreWorker, wuauclt, UsoClient, CompatTelRunner, defrag, ngen, ngentask, mscorsvw, DismHost, cleanmgr, wermgr
load_max_pct = 40
core_load_max_pct = 10
bg_cpu_max_pct_of_core = 1
gpu_util_max_pct = 5
nvme_temp_max_c = 70
nvme_volume = C
disk_write_max_bytes_s = 1048576
disk_queue_max = 0
settle_timeout_s = 60
load_window_ms = 2000
disk_window_ms = 1000
excluded_cpu_max_ms = 0
window_start_pt = 23:00
window_end_pt = 07:00
last_end_pt = 06:45
# [pre-night amendment] `x4svc topology`: the first LP of the last core of CCD1 (LP 30 [M, 2026-10-23])
orchestrator_lp = 30
session_setup_s = 120

[run_type mb-q4-avx512]
overhead_s = 5
harness = D:\mithril\x4c\bin\x4harness_hearth.exe
# [pre-night amendment] the SHA-256 of the file that will run (the MSVC link stamps the image, so a
# rebuild is a new pin)
# harness_sha256: not pinned yet
workload = mb_q4_avx512
# [pre-night amendment] K = ceil(10 s / median per-call time of 3 dev runs of 2^16 calls on LP p);
# indicative only: 1,761,170 from 3 dev runs on LP 28 in daytime [M, 2026-10-23]
param = 1761170
out_bytes = 960
# [pre-night amendment] `x4svc topology`: LP p = the first LP of the second core of CCD0 (LP 2 [M])
affinity = 0x4
threads = 1
priority = normal
memory_gib = 2
env = HEARTH_ISA=avx512
env = HEARTH_LOG=0
env = CUDA_VISIBLE_DEVICES=-1
# [pre-night amendment] the output SHA-256 of one dev run of this binary (independent of K and LP:
# 55b9c367f122fd9a14530ac5bc6e1a872314317cd46f10ff5acf96c042c0a036 on the 2026-10-23 dev build [M])
golden = learn
# observe-mode ceilings, record section 3 [target]
kappa_post_cycles = 2000000000
eps_spin_us = 50
eps_idle_us = 1000
init_max_ms = 2000
init_max_cycles = 8600000000
extra_cores_milli = 250
time_cap_s = 60
sessions = 20
blocks = 24
t_run_plan_s = 10
cooldown_factor = 1
# [pre-night amendment] `x4svc fingerprint --scratch D:\mithril-data\x4\scratch --affinity 0x4
#   --env HEARTH_ISA=avx512 --env HEARTH_LOG=0` prints the two lines of this file
pins = D:\mithril-data\x4\pins\mb-q4-avx512.txt

[run_type e2e-decode]
overhead_s = 5
harness = D:\mithril\x4c\bin\x4harness_hearth.exe
# harness_sha256: not pinned yet
workload = e2e_decode
param = 2048
out_bytes = 607744
# [C01] default "lift inside windows only": every LP but the orchestrator's (0xbfffffff [M]); if C01 =
# keep the cap, the record's e2e-reduced-8t: affinity 0xff, HEARTH_THREADS + HEARTH_IO_THREADS = 8
affinity = 0xbfffffff
# HEARTH_THREADS + HEARTH_IO_THREADS
threads = 24
priority = normal
memory_gib = 24
env = HEARTH_ISA=avx512
env = HEARTH_LOG=0
env = CUDA_VISIBLE_DEVICES=-1
# [C01] proposals [G]: Hearth's own defaults on this box (physical cores, 8 I/O threads, 8 GiB)
env = HEARTH_THREADS=16
env = HEARTH_IO_THREADS=8
env = HEARTH_CACHE_GB=8
# [C02] default: the existing Qwen3-30B-A3B Q4 container on the 990 PRO, read-only (located
# 2026-10-23: 17,028,976,640 B, arch qwen3_moe, source Qwen3-30B-A3B [M]); never the USB HDD (D:)
env = X4_MODEL_PATH=C:\Users\pierce lonergan\hearth-data\qwen3-30b-a3b-q4.hearth
# [pre-night amendment] the last-token logits SHA-256 of one dev run at N = 2,048 with this binary
golden = learn
kappa_post_cycles = 2000000000
eps_spin_us = 50
eps_idle_us = 1000
init_max_ms = 120000
# record section 3: 120 s x the declared threads x the night's calibrated cycle rate
init_max_cycles = derive
extra_cores_milli = 250
time_cap_s = 600
sessions = 3
blocks = 12
t_run_plan_s = 120
cooldown_factor = 1.5
pins = D:\mithril-data\x4\pins\e2e-decode.txt
