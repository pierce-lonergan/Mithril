# X4 noise pilot -- DEV configuration for short dev runs only (X4 pilot track, 2026-10-23).
#
#   x4svc dev-run --config <this file> --run-type mb-q4-avx512 [--param K] [--dev-self-golden]
#   x4svc dev-run --config <this file> --run-type e2e-dev      [--param N]
#
# `pilot-night` refuses a DEV configuration. Revision 4 (review 2026-10-23): every run type's
# environment holds CUDA_VISIBLE_DEVICES=-1 (the coexistence rule; the harness's environment block is
# explicit, so the variable must be named here); `quiesce-wake` and `quiesce-wake-q0` are the
# quiescence race probe on the pilot harness and on its dev-only variant without the wake accounting.
#
#   x4svc dev-run --config <this file> --run-type quiesce-wake    [--param N]
#   x4svc dev-run --config <this file> --run-type quiesce-wake-q0 [--param N]
#
# `pilot-night` refuses a DEV configuration. These are the pilot's two workloads at dev sizes inside
# this track's 3-thread desktop budget: the microbenchmark on LP 28 (one thread), the end-to-end decode
# on LPs 27-28 with HEARTH_THREADS=1 (the caller) and HEARTH_IO_THREADS=1, a 1 GiB expert cache and
# a few decode tokens. The pilot's own placement, thread counts, cache and N = 2,048 are in
# pilot.cfg.template; nothing measured here is pilot data.
grade = DEV
seed = 6a314c1f9fc1d48b
scratch = D:\mithril\x4c\scratch
excluded_images = x4plant_gems
bg_images = MsMpEng, SearchIndexer, TiWorker
orchestrator_lp = 26

[run_type mb-q4-avx512]
env = CUDA_VISIBLE_DEVICES=-1
overhead_s = 5
harness = D:\mithril\x4c\bin\x4harness_hearth.exe
workload = mb_q4_avx512
param = 65536
out_bytes = 960
affinity = 0x10000000
threads = 1
priority = normal
memory_gib = 2
env = HEARTH_ISA=avx512
env = HEARTH_LOG=0
golden = learn
kappa_post_cycles = 2000000000
eps_spin_us = 50
eps_idle_us = 1000
init_max_ms = 2000
init_max_cycles = 8600000000
extra_cores_milli = 250
time_cap_s = 60
sessions = 1
blocks = 1
t_run_plan_s = 10
cooldown_factor = 1

[run_type e2e-dev]
