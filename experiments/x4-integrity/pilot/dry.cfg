# X4 noise pilot -- DRY-RUN configuration (X4 pilot track, 2026-10-23). NOT a pilot configuration.
#
#   cmd /c start "" /b /wait /affinity 0x1C000000 D:\mithril\x4c\bin\x4svc.exe pilot-night --config <this file> --dry-run --plants
#
# (revision 4: started on the track's LPs 26-28; the driver pins itself to orchestrator_lp before the
# pre-start items, and the self-test's job gets the first run type's mask)
#
# A dry run plays one whole pilot night's schedule on a virtual Pacific clock (each run advances it
# by the run type's planned t_run x c, each session by the setup time) with the tiny `dry_mb_tiny`
# workload, real read-only sensors and the thresholds below, then plants one trigger per section 10
# sensor. Every record line is stamped DRY-RUN and lands under <scratch>\dry\; no estimator may read it.
#
# Dry thresholds differ from the record ON PURPOSE, so a daytime machine (GEMS, agents, Defender) does
# not void every session: the sensors are read and recorded at every run, and the plant phase sets
# the record's threshold for the sensor each plant targets. The record's values are in
# pilot.cfg.template. This track's desktop budget is 3 threads: the orchestrator is pinned to LP 26,
# every run to LP 28.
grade = DRY-RUN
record = docs/m0/prereg/X4-noise-pilot.md (DRAFT)
# the record's seed rule applied to 40 zeros (no freeze commit exists)
seed = 6a314c1f9fc1d48b
scratch = D:\mithril\x4c\scratch
probe_exe = D:\mithril\x4c\bin\x4sb_probe.exe
# daytime processes would void every dry session; the plants use these names (pilot lists: template)
excluded_images = x4plant_gems
excluded_started_images = x4plant_shell
bg_images = MsMpEng, MpDefenderCoreService, MpCmdRun, SearchIndexer, SearchProtocolHost, SearchFilterHost, TiWorker, TrustedInstaller, MoUsoCoreWorker, wuauclt, UsoClient, CompatTelRunner, defrag, ngen, ngentask, mscorsvw, DismHost, cleanmgr, wermgr
load_max_pct = 100
# the run core rule relaxed: LP 28's sibling, LP 29, lies outside this track's LPs (the plant sets 10)
core_load_max_pct = 100
bg_cpu_max_pct_of_core = 100000
gpu_util_max_pct = 101
nvme_temp_max_c = 70
nvme_volume = C
disk_write_max_bytes_s = 1000000000000000
disk_queue_max = 1000000000
settle_timeout_s = 2
load_window_ms = 100
disk_window_ms = 100
excluded_cpu_max_ms = 0
window_start_pt = 23:00
window_end_pt = 07:00
last_end_pt = 06:45
orchestrator_lp = 26
# the plant processes run on LPs 26-28 (the track's budget); without this they would inherit the
# orchestrator's one LP, and a 3-thread load plant would add one LP of load, not three
plant_affinity = 0x1C000000
session_setup_s = 120

[run_type mb-q4-avx512]
env = CUDA_VISIBLE_DEVICES=-1
overhead_s = 5
harness = D:\mithril\x4c\bin\x4harness_hearth.exe
workload = dry_mb_tiny
param = 256
out_bytes = 960
affinity = 0x10000000
threads = 1
priority = normal
memory_gib = 2
env = HEARTH_ISA=avx512
env = HEARTH_LOG=0
golden = learn
kappa_post_cycles = 2000000000
eps_spin_us = 50
eps_idle_us = 1000
init_max_ms = 2000
init_max_cycles = 8600000000
extra_cores_milli = 250
time_cap_s = 60
sessions = 20
blocks = 24
t_run_plan_s = 10
cooldown_factor = 1

# the end-to-end sessions run the same tiny stand-in workload, scheduled with e2e-decode's planned
# durations (120 s x 1.5), so the night's schedule is the pilot's
[run_type e2e-decode]
env = CUDA_VISIBLE_DEVICES=-1
overhead_s = 5
harness = D:\mithril\x4c\bin\x4harness_hearth.exe
workload = dry_mb_tiny
param = 256
out_bytes = 960
affinity = 0x10000000
threads = 1
priority = normal
memory_gib = 2
env = HEARTH_ISA=avx512
env = HEARTH_LOG=0
golden = learn
kappa_post_cycles = 2000000000
eps_spin_us = 50
eps_idle_us = 1000
init_max_ms = 120000
init_max_cycles = derive
extra_cores_milli = 250
time_cap_s = 60
sessions = 3
blocks = 12
t_run_plan_s = 120
cooldown_factor = 1.5
